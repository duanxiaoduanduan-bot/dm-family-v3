<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存储管理 - 杨鑫瑞资料合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a0f;color:#e0e0ee;min-height:100vh;overflow-x:hidden}

/* 粒子背景 */
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}
.p{position:absolute;width:2px;height:2px;background:#6c5ce7;border-radius:50%;opacity:.12;animation:fl linear infinite}
@keyframes fl{0%{transform:translateY(100vh);opacity:0}10%{opacity:.12}90%{opacity:.12}100%{transform:translateY(-10vh);opacity:0}}

/* 顶栏 */
.header{position:relative;z-index:1;padding:18px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(10,10,15,.8);backdrop-filter:blur(20px)}
.header .logo{font-size:22px;font-weight:700;background:linear-gradient(135deg,#6c5ce7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.header .actions .btn{padding:7px 18px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#aaa;font-size:12px;cursor:pointer;text-decoration:none;transition:all .2s}
.header .actions .btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(108,92,231,.3)}
.header .actions .btn.danger{color:#e74c3c;border-color:rgba(231,76,60,.15)}
.header .actions .btn.danger:hover{background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.4)}

/* 主内容 */
.main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:32px 20px 40px}
.main h1{font-size:24px;font-weight:700;margin-bottom:6px}
.main .subtitle{color:#666;font-size:13px;margin-bottom:28px;line-height:1.6}

/* ROOT 路径提示 */
.root-info{padding:12px 16px;border-radius:10px;background:rgba(108,92,231,.08);border:1px solid rgba(108,92,231,.15);margin-bottom:24px;font-size:12px;color:#888;display:flex;align-items:center;gap:10px}
.root-info code{color:#00cec9;font-size:12px;word-break:break-all}
.root-info .icon{font-size:16px}

/* 站点名称编辑 */
.site-name-box{padding:14px 18px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);margin-bottom:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.site-name-label{font-size:13px;color:#888;white-space:nowrap}
.site-name-value{font-size:18px;font-weight:700;background:linear-gradient(135deg,#6c5ce7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex:1}
.site-name-edit{background:none;border:none;color:#666;cursor:pointer;font-size:14px;padding:4px 8px;transition:color .2s}
.site-name-edit:hover{color:#fff}
.site-name-form{display:flex;gap:6px;width:100%;align-items:center}
.site-name-form input{flex:1;padding:8px 12px;border-radius:7px;border:1px solid rgba(108,92,231,.2);background:rgba(10,10,15,.6);color:#e0e0ee;font-size:14px;outline:none;font-family:inherit}
.site-name-form input:focus{border-color:rgba(108,92,231,.5)}
.site-name-form button{padding:7px 16px;border-radius:7px;font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.site-name-form button.save{background:rgba(108,92,231,.2);border:1px solid rgba(108,92,231,.3);color:#a29bfe}
.site-name-form button.save:hover{background:rgba(108,92,231,.35)}
.site-name-form button.cancel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#888}
.site-name-form button.cancel:hover{color:#e74c3c}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:22px 20px;transition:all .25s;position:relative}
.card:hover{border-color:rgba(108,92,231,.2);box-shadow:0 4px 24px rgba(108,92,231,.06)}
.card .card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card .card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card .card-name{font-size:15px;font-weight:600}
.card .card-type{font-size:11px;color:#555}

.card .path-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .path-label{font-size:11px;color:#555;white-space:nowrap;min-width:44px}
.card .path-value{font-size:12px;color:#aaa;background:rgba(255,255,255,.04);padding:5px 10px;border-radius:6px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;border:1px solid rgba(255,255,255,.04)}
.card .path-resolved{font-size:11px;color:#666;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace}

.card .status-row{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.card .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.card .status-dot.ok{background:#00cec9;box-shadow:0 0 6px rgba(0,206,201,.3)}
.card .status-dot.warn{background:#fdcb6e;box-shadow:0 0 6px rgba(253,203,110,.3)}
.card .status-dot.err{background:#e74c3c;box-shadow:0 0 6px rgba(231,76,60,.3)}
.card .status-text{font-size:11px}
.card .status-text.ok{color:#00cec9}
.card .status-text.warn{color:#fdcb6e}
.card .status-text.err{color:#e74c3c}

.card .card-actions{display:flex;gap:8px}
.card .card-actions button{padding:6px 14px;border-radius:7px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#aaa;font-size:11px;cursor:pointer;transition:all .2s}
.card .card-actions button:hover{background:rgba(255,255,255,.08);color:#fff}
.card .card-actions button.save{background:rgba(108,92,231,.15);border-color:rgba(108,92,231,.3);color:#a29bfe}
.card .card-actions button.save:hover{background:rgba(108,92,231,.25)}
.card .card-actions button.cancel{color:#888}
.card .card-actions button.cancel:hover{color:#e74c3c}

/* 编辑模式 */
.card.editing{border-color:rgba(108,92,231,.3);box-shadow:0 0 20px rgba(108,92,231,.08)}
.card .edit-form{display:none;margin-top:10px}
.card.editing .edit-form{display:block}
.card.editing .path-display{display:none}
.card.editing .status-row{display:none}
.card.editing .card-actions .edit-btn{display:none}
.card .edit-form .input-row{display:flex;gap:6px;margin-bottom:8px}
.card .edit-form .input-row input{flex:1;padding:8px 12px;border-radius:7px;border:1px solid rgba(108,92,231,.2);background:rgba(10,10,15,.6);color:#e0e0ee;font-size:13px;font-family:monospace;outline:none}
.card .edit-form .input-row input:focus{border-color:rgba(108,92,231,.5)}
.card .edit-form .input-row .browse-btn{padding:8px 14px;border-radius:7px;border:1px solid rgba(108,92,231,.2);background:rgba(108,92,231,.1);color:#a29bfe;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s}
.card .edit-form .input-row .browse-btn:hover{background:rgba(108,92,231,.25)}
.card .edit-form .hint{font-size:10px;color:#555;margin-bottom:10px;line-height:1.5}

/* 目录浏览器弹窗 */
.browser-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.browser-overlay.show{display:flex}
.browser-box{background:#12121a;border:1px solid rgba(108,92,231,.2);border-radius:14px;width:90vw;max-width:520px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
.browser-box .browser-head{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.browser-box .browser-head .browser-title{font-size:14px;font-weight:600;flex:1}
.browser-box .browser-head .browser-close{background:none;border:none;color:#666;font-size:18px;cursor:pointer;padding:4px 8px}
.browser-box .browser-head .browser-close:hover{color:#e74c3c}
.browser-box .browser-path{font-size:11px;color:#555;padding:8px 18px;font-family:monospace;word-break:break-all;border-bottom:1px solid rgba(255,255,255,.04)}
.browser-box .browser-list{flex:1;overflow-y:auto;padding:8px}
.browser-box .browser-list .browser-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .15s;font-size:13px;color:#aaa}
.browser-box .browser-list .browser-item:hover{background:rgba(108,92,231,.1);color:#fff}
.browser-box .browser-list .browser-item .browser-icon{font-size:16px;width:24px;text-align:center}
.browser-box .browser-list .browser-item.parent{color:#888;font-size:12px}
.browser-box .browser-list .browser-empty{padding:24px;text-align:center;color:#555;font-size:13px}
.browser-box .browser-actions{padding:12px 18px;border-top:1px solid rgba(255,255,255,.04);display:flex;gap:8px;justify-content:flex-end}
.browser-box .browser-actions button{padding:7px 16px;border-radius:7px;font-size:12px;cursor:pointer;transition:all .2s}
.browser-box .browser-actions .btn-select{padding:7px 20px;background:rgba(108,92,231,.2);border:1px solid rgba(108,92,231,.3);color:#a29bfe}
.browser-box .browser-actions .btn-select:hover{background:rgba(108,92,231,.35)}
.browser-box .browser-actions .btn-cancel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#888}
.browser-box .browser-actions .btn-cancel:hover{color:#e74c3c}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:100;padding:10px 24px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:all .3s}
.toast.show{opacity:1}
.toast.success{background:rgba(0,206,201,.15);border:1px solid rgba(0,206,201,.3);color:#00cec9}
.toast.error{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);color:#e74c3c}

/* 分组标题 */
.section-title{font-size:13px;color:#555;margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:8px}
.section-title .count{font-size:11px;color:#444}

/* 底部 */
.footer{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.05);padding:20px 32px;text-align:center;font-size:12px;color:#444}

/* 媒体图标颜色 */
.ci-music{background:linear-gradient(135deg,#6c5ce740,#00cec940);color:#00cec9}
.ci-video{background:linear-gradient(135deg,#c0392b40,#e74c3c40);color:#e74c3c}
.ci-tvdrama{background:linear-gradient(135deg,#e1705540,#fdcb6e40);color:#fdcb6e}
.ci-album{background:linear-gradient(135deg,#fd79a840,#e1705540);color:#e17055}
.ci-book{background:linear-gradient(135deg,#c49a2a40,#8b691440);color:#c49a2a}
.ci-pdf{background:linear-gradient(135deg,#d6303140,#e1705540);color:#d63031}
.ci-audio{background:linear-gradient(135deg,#00b89440,#00cec940);color:#00b894}
.ci-geodata{background:linear-gradient(135deg,#0984e340,#6c5ce740);color:#0984e3}

@media(max-width:640px){
.header{padding:14px 16px;flex-wrap:wrap;gap:10px}
.header .logo{font-size:18px}
.main{padding:24px 14px 30px}
.grid{grid-template-columns:1fr;gap:12px}
}
</style>
</head>
<body>
<div id="particles"></div>

<div class="header">
<div class="logo">⚙️ 存储管理</div>
<div class="actions">
<a class="btn" href="index.html">← 返回首页</a>
<button class="btn danger" onclick="resetAll()" title="恢复所有路径为默认值">🔄 恢复默认</button>
</div>
</div>

<div class="main">
<h1>存储路径管理</h1>
<p class="subtitle">管理各媒体类型的存储目录。支持相对路径（相对于项目根目录）和绝对路径（如外部硬盘 /mnt/nas/music）。<br>修改后会自动清除缓存，下次访问时重新扫描。</p>

<div class="root-info">
<span class="icon">📁</span>
<span>项目根目录：<code id="rootPath">...</code></span>
</div>

<!-- 站点名称 -->
<div class="site-name-box" id="siteNameBox">
<span class="site-name-label">🏠 站点名称</span>
<span class="site-name-value" id="siteNameDisplay">杨鑫瑞资料合集</span>
<button class="site-name-edit" onclick="editSiteName()">✏️</button>
<div class="site-name-form" id="siteNameForm" style="display:none">
  <input type="text" id="siteNameInput" placeholder="输入站点名称" maxlength="30">
  <button class="save" onclick="saveSiteName()">💾</button>
  <button class="cancel" onclick="cancelSiteName()">取消</button>
</div>
</div>

<div class="grid" id="cardsGrid"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 目录浏览器弹窗 -->
<div class="browser-overlay" id="browserOverlay">
<div class="browser-box">
<div class="browser-head">
<span class="browser-title">📁 选择目录</span>
<button class="browser-close" onclick="closeBrowser()">✕</button>
</div>
<div class="browser-path" id="browserPath">/</div>
<div style="padding:4px 12px;display:flex;gap:6px;flex-wrap:wrap">
  <button onclick="browseTo('/')" style="padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#aaa;font-size:11px;cursor:pointer;font-family:inherit">🏠 根目录</button>
  <button onclick="browseTo('/media')" style="padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#aaa;font-size:11px;cursor:pointer;font-family:inherit">📀 /media</button>
  <button onclick="browseTo('/mnt')" style="padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#aaa;font-size:11px;cursor:pointer;font-family:inherit">💾 /mnt</button>
  <button onclick="browseTo('/run/media')" style="padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#aaa;font-size:11px;cursor:pointer;font-family:inherit">💿 /run/media</button>
</div>
<div class="browser-list" id="browserList"></div>
<div class="browser-actions">
<button class="btn-cancel" onclick="closeBrowser()">取消</button>
<button class="btn-select" onclick="selectCurrentDir()">✅ 选择当前目录</button>
</div>
</div>
</div>

<div class="footer">杨鑫瑞资料合集 v2.0 · 存储管理</div>

<script>
// 媒体类型配置
const MEDIA_TYPES = {
  music:    { icon:'🎵', name:'音乐',   cls:'ci-music',   desc:'歌曲文件（MP3/FLAC等）' },
  video:    { icon:'🎬', name:'视频',   cls:'ci-video',   desc:'独立视频文件' },
  tvdrama:  { icon:'📺', name:'电视剧', cls:'ci-tvdrama', desc:'按剧名分文件夹' },
  album:    { icon:'🖼️', name:'写真馆', cls:'ci-album',   desc:'图片/视频相册' },
  book:     { icon:'📖', name:'阅读',   cls:'ci-book',    desc:'TXT/EPUB电子书' },
  pdf:      { icon:'📄', name:'PDF',    cls:'ci-pdf',     desc:'PDF文档' },
  audio:    { icon:'🎧', name:'音频',   cls:'ci-audio',   desc:'Audio目录（备用）' },
  geodata:  { icon:'🗺️', name:'地图数据', cls:'ci-geodata', desc:'GeoJSON/GPX/照片' },
};

let configData = {};
let editingKey = null;
let browserKey = null;
let browserCurrent = '/';

async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const data = await r.json();
    configData = data;
    document.getElementById('rootPath').textContent = data.root;
    document.getElementById('siteNameDisplay').textContent = data.siteName || '杨鑫瑞资料合集';
    renderCards(data.paths);
  } catch(e) {
    showToast('无法加载配置：' + e.message, 'error');
  }
}

function renderCards(paths) {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';

  // 分组：项目内 vs 外部
  const internal = [], external = [];
  for (const [key, cfg] of Object.entries(paths)) {
    const resolved = cfg.resolved || '';
    const isExternal = resolved && configData.root && !resolved.startsWith(configData.root);
    (isExternal ? external : internal).push({ key, ...cfg });
  }

  function renderGroup(items, title) {
    if (!items.length) return;
    const h3 = document.createElement('div');
    h3.className = 'section-title';
    h3.innerHTML = title + ' <span class="count">(' + items.length + ')</span>';
    grid.appendChild(h3);

    for (const item of items) {
      const meta = MEDIA_TYPES[item.key] || { icon:'📦', name:item.key, cls:'', desc:'' };
      const resolved = item.resolved || '';
      const exists = item.exists !== undefined ? item.exists : null;

      // 判断路径状态
      let statusClass = 'warn', statusText = '未知';
      if (exists === true) { statusClass = 'ok'; statusText = '目录存在'; }
      else if (exists === false) { statusClass = 'err'; statusText = '目录不存在'; }
      else if (resolved) { statusClass = 'warn'; statusText = '待验证'; }

      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + item.key;
      card.innerHTML = `
        <div class="card-head">
          <div class="card-icon ${meta.cls}">${meta.icon}</div>
          <div>
            <div class="card-name">${meta.name}</div>
            <div class="card-type">${meta.desc}</div>
          </div>
        </div>
        <div class="path-display">
          <div class="path-row">
            <span class="path-label">配置路径</span>
            <span class="path-value" title="${esc(item.dir)}">${esc(item.dir)}</span>
          </div>
          <div class="path-resolved" title="${esc(resolved)}">→ ${esc(resolved)}</div>
          <div class="status-row">
            <span class="status-dot ${statusClass}"></span>
            <span class="status-text ${statusClass}">${statusText}</span>
          </div>
        </div>
        <div class="edit-form">
          <div class="input-row">
            <input type="text" id="input-${item.key}" value="${esc(item.dir)}" placeholder="输入路径，如 ./my-music 或 /mnt/nas/music">
            <button class="browse-btn" onclick="openBrowser('${item.key}')">📁 浏览</button>
          </div>
          <div class="hint">支持相对路径（./xxx）或绝对路径（/mnt/nas/xxx）</div>
          <div class="card-actions">
            <button class="save" onclick="saveEdit('${item.key}')">💾 保存</button>
            <button class="cancel" onclick="cancelEdit('${item.key}')">取消</button>
          </div>
        </div>
        <div class="card-actions">
          <button class="edit-btn" onclick="startEdit('${item.key}')">✏️ 编辑</button>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  renderGroup(internal, '📂 项目内路径');
  renderGroup(external, '🌐 外部路径');
}

function startEdit(key) {
  if (editingKey && editingKey !== key) cancelEdit(editingKey);
  editingKey = key;
  const card = document.getElementById('card-' + key);
  if (card) card.classList.add('editing');
  const input = document.getElementById('input-' + key);
  if (input) { input.focus(); input.select(); }
}

function cancelEdit(key) {
  editingKey = null;
  const card = document.getElementById('card-' + key);
  if (card) card.classList.remove('editing');
}

async function saveEdit(key) {
  const input = document.getElementById('input-' + key);
  if (!input) return;
  const newDir = input.value.trim();
  if (!newDir) { showToast('路径不能为空', 'error'); return; }

  try {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: { [key]: { dir: newDir } } })
    });
    const data = await r.json();
    if (data.ok) {
      showToast('✅ ' + MEDIA_TYPES[key].name + ' 路径已更新，缓存已清除', 'success');
      cancelEdit(key);
      loadConfig();
    } else {
      showToast('保存失败：' + (data.error || '未知错误'), 'error');
    }
  } catch(e) {
    showToast('请求失败：' + e.message, 'error');
  }
}

async function resetAll() {
  if (!confirm('确定要恢复所有路径为默认值吗？\n\n这将把所有媒体目录路径重置为项目内的默认位置。')) return;
  try {
    const paths = {};
    for (const key of Object.keys(MEDIA_TYPES)) {
      paths[key] = { dir: './' + (key === 'audio' ? 'Audio' : key) };
    }
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths })
    });
    const data = await r.json();
    if (data.ok) {
      showToast('✅ 已恢复默认配置，缓存已清除', 'success');
      loadConfig();
    } else {
      showToast('恢复失败：' + (data.error || '未知错误'), 'error');
    }
  } catch(e) {
    showToast('请求失败：' + e.message, 'error');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success') + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== 站点名称编辑 =====
function editSiteName(){
  document.getElementById('siteNameDisplay').style.display='none';
  document.querySelector('.site-name-edit').style.display='none';
  var form=document.getElementById('siteNameForm');
  form.style.display='flex';
  var input=document.getElementById('siteNameInput');
  input.value=document.getElementById('siteNameDisplay').textContent;
  input.focus();input.select();
}

function cancelSiteName(){
  document.getElementById('siteNameDisplay').style.display='';
  document.querySelector('.site-name-edit').style.display='';
  document.getElementById('siteNameForm').style.display='none';
}

async function saveSiteName(){
  var input=document.getElementById('siteNameInput');
  var name=input.value.trim();
  if(!name){showToast('名称不能为空','error');return}
  try{
    var r=await fetch('/api/config',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({siteName:name})
    });
    var data=await r.json();
    if(data.ok){
      document.getElementById('siteNameDisplay').textContent=name;
      cancelSiteName();
      showToast('✅ 站点名称已更新','success');
    }else{
      showToast('保存失败：'+(data.error||'未知错误'),'error');
    }
  }catch(e){showToast('请求失败：'+e.message,'error')}
}

// ===== 目录浏览器 =====
async function openBrowser(key) {
  browserKey = key;
  // 从 input 里取当前值作为起始路径
  const input = document.getElementById('input-' + key);
  let startPath = (input && input.value.trim()) || './';
  // 如果是相对路径，先转绝对路径用于浏览
  if (startPath.startsWith('./') || startPath.startsWith('../')) {
    startPath = (configData.root || '/') + '/' + startPath.replace(/^\.\//, '');
  }
  if (!startPath.startsWith('/')) startPath = '/' + startPath;
  await browseTo(startPath);
  document.getElementById('browserOverlay').classList.add('show');
}

function closeBrowser() {
  document.getElementById('browserOverlay').classList.remove('show');
  browserKey = null;
}

async function browseTo(dirPath) {
  browserCurrent = dirPath;
  document.getElementById('browserPath').textContent = dirPath;
  const list = document.getElementById('browserList');
  list.innerHTML = '<div style="padding:24px;text-align:center;color:#555;">加载中...</div>';

  try {
    const r = await fetch('/api/browse?path=' + encodeURIComponent(dirPath));
    const data = await r.json();
    if (data.error) { list.innerHTML = '<div class="browser-empty">⚠️ ' + data.error + '</div>'; return; }

    let html = '';
    // 上级目录
    if (data.parent !== null) {
      html += '<div class="browser-item parent" onclick="browseTo(\'' + escJs(data.parent) + '\')"><span class="browser-icon">📂</span>..（上级目录）</div>';
    }
    // 子目录列表
    if (data.dirs.length === 0) {
      html += '<div class="browser-empty">此目录下没有子文件夹</div>';
    } else {
      for (const d of data.dirs) {
        html += '<div class="browser-item" onclick="browseTo(\'' + escJs(d.path) + '\')"><span class="browser-icon">📁</span>' + esc(d.name) + '</div>';
      }
    }
    list.innerHTML = html;
  } catch(e) {
    list.innerHTML = '<div class="browser-empty">⚠️ 无法访问：' + esc(e.message) + '</div>';
  }
}

function selectCurrentDir() {
  if (!browserKey) return;
  const input = document.getElementById('input-' + browserKey);
  if (input) {
    // 尽量转回相对路径（如果在项目根目录下）
    const root = configData.root || '';
    if (root && browserCurrent.startsWith(root + '/')) {
      input.value = './' + browserCurrent.slice(root.length + 1);
    } else if (root && browserCurrent === root) {
      input.value = './';
    } else {
      input.value = browserCurrent;
    }
  }
  closeBrowser();
}

function escJs(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
