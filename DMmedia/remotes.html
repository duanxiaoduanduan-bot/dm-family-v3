<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转播服务器 · DMmedia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a0f;color:#e0e0ee;min-height:100vh}
.header{position:sticky;top:0;z-index:10;padding:16px 28px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(10,10,15,.85);backdrop-filter:blur(20px)}
.header .logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,#6c5ce7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .actions{margin-left:auto;display:flex;gap:8px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#bbb;font-size:13px;cursor:pointer;text-decoration:none;transition:all .2s}
.btn:hover{background:rgba(255,255,255,.08);color:#fff}
.btn.primary{background:linear-gradient(135deg,#6c5ce7,#00cec9);border:none;color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:22px;margin-bottom:18px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px}
.row{display:flex;gap:10px;margin-bottom:10px}
input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#e0e0ee;font-size:13px;outline:none}
input:focus{border-color:rgba(108,92,231,.5)}
.hint{font-size:12px;color:#666;margin-bottom:10px;line-height:1.6}
.remote{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(255,255,255,.02);margin-bottom:10px}
.remote .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.remote .dot.on{background:#00cec9;box-shadow:0 0 8px rgba(0,206,201,.5)}
.remote .dot.off{background:#e74c3c}
.remote .info{flex:1;min-width:0}
.remote .info .name{font-size:14px;font-weight:600}
.remote .info .url{font-size:12px;color:#666;font-family:monospace;word-break:break-all;margin-top:2px}
.remote .tag{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(0,206,201,.12);color:#00cec9;border:1px solid rgba(0,206,201,.2)}
.remote .tag.off{background:rgba(231,76,60,.12);color:#e74c3c;border-color:rgba(231,76,60,.2)}
.remote .del{background:none;border:none;color:#555;cursor:pointer;font-size:14px;padding:6px 10px;border-radius:6px}
.remote .del:hover{color:#e74c3c;background:rgba(231,76,60,.1)}
.empty{text-align:center;color:#555;padding:30px;font-size:13px;line-height:1.8}
.msg{font-size:12px;margin-top:8px;min-height:16px}
.msg.ok{color:#00cec9}.msg.err{color:#e74c3c}
@media(max-width:640px){.row{flex-direction:column}input{width:100%}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🛰️ 转播服务器</div>
  <div class="actions">
    <a class="btn" href="index.html">← 返回首页</a>
    <button class="btn primary" onclick="reconnectAll()">🔄 一键重连</button>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <h2>添加转播服务器（握手）</h2>
    <p class="hint">输入另一台 DMmedia 服务器的地址（如 http://192.168.1.41:8081），点「握手」。之后本机 6 个媒体页会自动合并对方的目录；对方关机则自动只剩本机。</p>
    <div class="row">
      <input id="urlInput" placeholder="http://对方IP:8081" />
      <input id="nameInput" placeholder="备注名（可选）" style="flex:0 0 180px" />
      <button class="btn primary" onclick="handshake()">握手</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>已配转播服务器</h2>
    <div id="list"></div>
  </div>
</div>

<script>
var $ = function(id){return document.getElementById(id)};

function setMsg(t, cls){ $('msg').textContent = t; $('msg').className = 'msg ' + (cls||''); }

async function loadRemotes(){
  $('list').innerHTML = '<div class="empty">加载中…</div>';
  try{
    var r = await fetch('api/remotes?_='+Date.now());
    var d = await r.json();
    render(d.remotes || []);
  }catch(e){
    $('list').innerHTML = '<div class="empty">加载失败</div>';
  }
}

function render(list){
  if(!list.length){ $('list').innerHTML = '<div class="empty">还没有转播服务器。<br>在上方输入对方地址并点「握手」。</div>'; return; }
  var html = '';
  list.forEach(function(r){
    var on = r.online;
    html += '<div class="remote">'
      + '<div class="dot '+(on?'on':'off')+'"></div>'
      + '<div class="info"><div class="name">'+esc(r.name)+'</div><div class="url">'+esc(r.url)+'</div></div>'
      + '<span class="tag '+(on?'':'off')+'">'+(on?'在线':'离线')+'</span>'
      + '<button class="del" title="删除" onclick="removeRemote(\''+esc(r.id)+'\')">✕</button>'
      + '</div>';
  });
  $('list').innerHTML = html;
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function handshake(){
  var url = $('urlInput').value.trim();
  var name = $('nameInput').value.trim();
  if(!url){ setMsg('请输入对方地址', 'err'); return; }
  setMsg('握手中…');
  try{
    var r = await fetch('api/remotes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url:url, name:name}) });
    var d = await r.json();
    if(d.ok){ setMsg('握手成功：已连接 '+(d.remote.name||url), 'ok'); $('urlInput').value=''; $('nameInput').value=''; loadRemotes(); }
    else { setMsg('握手失败：'+(d.error||'未知错误'), 'err'); }
  }catch(e){ setMsg('握手失败：'+e.message, 'err'); }
}

async function reconnectAll(){
  setMsg('重连中…');
  try{
    var r = await fetch('api/remotes/reconnect', { method:'POST' });
    var d = await r.json();
    if(d.ok){
      render(d.remotes||[]);
      var on = (d.remotes||[]).filter(function(x){return x.online}).length;
      setMsg('重连完成：'+on+'/'+(d.remotes||[]).length+' 在线', 'ok');
    } else { setMsg('重连失败', 'err'); }
  }catch(e){ setMsg('重连失败：'+e.message, 'err'); }
}

async function removeRemote(id){
  if(!confirm('删除这个转播服务器？')) return;
  try{
    await fetch('api/remotes?id='+encodeURIComponent(id), { method:'DELETE' });
    loadRemotes();
  }catch(e){ setMsg('删除失败', 'err'); }
}

$('urlInput').addEventListener('keydown', function(e){ if(e.key==='Enter') handshake(); });
loadRemotes();
</script>
</body></html>
