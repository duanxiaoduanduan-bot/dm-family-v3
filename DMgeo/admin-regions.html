<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍 行政区划管理</title>
<link rel="stylesheet" href="leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0a0f;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:10px 16px;background:rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:600;white-space:nowrap}
.header .level-tabs{display:flex;gap:2px;background:rgba(255,255,255,.03);border-radius:8px;padding:2px;border:1px solid rgba(255,255,255,.06)}
.level-tabs button{padding:4px 14px;border:none;border-radius:6px;background:transparent;color:#888;font-size:10px;cursor:pointer;transition:all .15s;white-space:nowrap}
.level-tabs button:hover{color:#ccc}
.level-tabs button.act{background:rgba(0,206,201,.15);color:#00cec9}
.header .actions{margin-left:auto;display:flex;gap:5px;align-items:center}
.header .actions button,.header .actions a{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#aaa;font-size:10px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .15s}
.header .actions button:hover,.header .actions a:hover{background:rgba(255,255,255,.08);color:#fff}
.header .actions button.primary{background:rgba(0,206,201,.2);border-color:rgba(0,206,201,.3);color:#00cec9}
.header .actions button.primary:hover{background:rgba(0,206,201,.3)}
.header .actions button.danger{background:rgba(231,76,60,.15);border-color:rgba(231,76,60,.3);color:#e74c3c}
.header .actions button.warn{background:rgba(243,156,18,.15);border-color:rgba(243,156,18,.3);color:#f39c12}
.header .actions button.success{background:rgba(46,204,113,.15);border-color:rgba(46,204,113,.3);color:#2ecc71}
.header .actions button.success:hover{background:rgba(46,204,113,.25)}
.main{flex:1;display:flex;overflow:hidden}
#map{flex:1;min-width:0;background:#1a1a2e;z-index:1}
.sidebar{width:320px;flex-shrink:0;background:rgba(12,12,22,.95);border-left:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
.sidebar-top input{padding:5px 10px;border-radius:5px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#ddd;font-size:10px;width:100%}
.sidebar-top input::placeholder{color:#555}
.sidebar-list{flex:1;overflow-y:auto;padding:4px}
.sidebar-list::-webkit-scrollbar{width:3px}
.sidebar-list::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
.item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:10px;display:flex;align-items:center;gap:8px;margin-bottom:1px;transition:all .1s;position:relative}
.item:hover{background:rgba(255,255,255,.04)}
.item.act{background:rgba(0,206,201,.1);border-left:2px solid #00cec9}
.item .i-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.item .i-info{flex:1;min-width:0}
.item .i-name{color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .i-code{font-size:8px;color:#555}
.item .i-btns{display:none;gap:2px;flex-shrink:0}
.item:hover .i-btns{display:flex}
.item .i-btns button{padding:2px 6px;border-radius:3px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#888;font-size:8px;cursor:pointer}
.item .i-btns button:hover{color:#fff;background:rgba(255,255,255,.1)}
.item .i-btns button.del:hover{color:#e74c3c;border-color:rgba(231,76,60,.4)}
.sidebar-foot{padding:8px 10px;border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;font-size:9px;color:#555;display:flex;justify-content:space-between}
.sidebar-foot b{color:#00cec9}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.leaflet-container{background:#1a1a2e!important}
.info-panel{position:absolute;bottom:30px;left:10px;z-index:500;background:rgba(12,12,22,.9);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 14px;font-size:10px;color:#aaa;pointer-events:none;display:none}
.info-panel.show{display:block}
.info-panel b{color:#fff}

/* 模态框 */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:#141420;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;width:420px;max-width:90vw;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:14px;font-size:14px;color:#fff}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:10px;color:#888;margin-bottom:4px}
.modal .field input,.modal .field select{width:100%;padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ddd;font-size:11px}
.modal .field input:focus,.modal .field select:focus{outline:none;border-color:#00cec9}
.modal .field textarea{width:100%;padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ddd;font-size:10px;resize:vertical;min-height:60px;font-family:monospace}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .btns button{padding:7px 18px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#ccc;font-size:11px;cursor:pointer}
.modal .btns button.primary{background:#00cec9;border-color:#00cec9;color:#000;font-weight:600}
.modal .btns button.danger{background:#e74c3c;border-color:#e74c3c;color:#fff}

/* 绘制提示条 */
.draw-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:rgba(0,206,201,.9);color:#000;padding:6px 16px;border-radius:20px;font-size:10px;font-weight:600;display:none;pointer-events:none;white-space:nowrap}
.draw-hint.show{display:block}

/* 底部确认栏 */
.confirm-bar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:700;display:none;gap:8px;padding:8px 16px;background:rgba(20,20,30,.95);border:1px solid rgba(255,255,255,.12);border-radius:30px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.confirm-bar.show{display:flex}
.confirm-bar button{padding:6px 16px;border-radius:20px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.confirm-bar button.ok{background:#2ecc71;color:#000}
.confirm-bar button.cancel{background:rgba(255,255,255,.1);color:#ccc}
.confirm-bar .info{font-size:10px;color:#888;padding:0 8px;display:flex;align-items:center;white-space:nowrap}

/* 上传区域 */
.upload-zone{border:2px dashed rgba(255,255,255,.1);border-radius:10px;padding:30px;text-align:center;color:#888;font-size:11px;cursor:pointer;transition:all .2s;margin:10px 0}
.upload-zone:hover,.upload-zone.drag{border-color:#00cec9;color:#00cec9;background:rgba(0,206,201,.05)}
.upload-zone input{display:none}

/* 编辑高亮顶点 */
.vertex-plus{background:#2ecc71!important;color:#fff!important;font-size:10px!important;text-align:center!important;line-height:18px!important;cursor:pointer!important}
</style>
</head>
<body>
<div class="header">
  <h1>📍 行政区划</h1>
  <div class="level-tabs" id="levelTabs">
    <button class="act" data-level="countries" onclick="switchLevel('countries')">🌍 国家</button>
    <button data-level="provinces" onclick="switchLevel('provinces')">🇨🇳 省</button>
    <button data-level="cities" onclick="switchLevel('cities')">🏙️ 市</button>
  </div>
  <div class="actions" id="toolbarActions">
    <button class="primary" onclick="startDraw()" id="btnDraw">✏️ 新建</button>
    <button class="warn" onclick="startEdit()" id="btnEdit">🖊️ 编辑</button>
    <button class="warn" onclick="startReplace()" id="btnReplace">🔄 替换</button>
    <button onclick="openUploadModal()" id="btnUpload">📤 上传</button>
    <a href="/db-manager.html">🗄️ 数据库</a> <a href="/db-manager.html">🗄️ 数据库</a> <a href="/">← 首页</a>
  </div>
</div>
<div class="main">
  <div id="map">
    <div class="info-panel" id="infoPanel"></div>
    <div class="draw-hint" id="drawHint"></div>
    <div class="confirm-bar" id="confirmBar">
      <span class="info" id="confirmInfo"></span>
      <button class="ok" onclick="confirmAction()">✅ 确认</button>
      <button class="cancel" onclick="cancelAction()">✕ 取消</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-top">
      <input id="searchInput" placeholder="🔍 搜索..." oninput="renderList()" />
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="leaflet.js"></script>
<script>
var currentLevel='countries';
var _geoData=null;
var _geoLayer=null;
var $=function(i){return document.getElementById(i)};
var toast=$('toast');
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},2000)}

// ===== Leaflet 地图 =====
var map=L.map('map',{center:[30,105],zoom:4,zoomControl:true});
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
  attribution:'&copy; 高德',maxZoom:18,subdomains:'1234'
}).addTo(map);

// ===== 状态 =====
var _mode=null;            // null | 'draw' | 'edit' | 'replace'
var _drawVertices=[];
var _drawMarkers=[];
var _drawPolyline=null;
var _editTarget=null;      // {feature, coords, markers, layer, origCoords}
var _replaceTarget=null;   // {feature} 替换模式选中的目标
var _confirmCallback=null; // 确认回调
var _provinceSelect=null;

var colors=['#00cec9','#6c5ce7','#e17055','#fdcb6e','#fd79a8','#0984e3','#00b894','#a29bfe',
  '#e74c3c','#c49a2a','#74b9ff','#55efc4','#fab1a0','#ffeaa7','#636e72','#8e44ad',
  '#2ecc71','#1abc9c','#3498db','#e67e22','#f39c12','#d35400','#c0392b','#16a085'];

// ===== 工具栏状态 =====
function resetToolbar(){
  $('btnDraw').textContent='✏️ 新建'; $('btnDraw').className='primary';
  $('btnEdit').textContent='🖊️ 编辑'; $('btnEdit').className='warn';
  $('btnReplace').textContent='🔄 替换'; $('btnReplace').className='warn';
  $('btnUpload').style.display='';
  $('confirmBar').classList.remove('show');
  $('drawHint').classList.remove('show');
  map.getContainer().style.cursor='';
}

// ===== 层级切换 =====
function switchLevel(level){
  exitAllModes();
  currentLevel=level;
  document.querySelectorAll('#levelTabs button').forEach(function(b){b.classList.toggle('act',b.dataset.level===level)});
  $('btnDraw').style.display=(level==='countries'?'none':'');
  $('btnReplace').style.display=(level==='countries'?'none':'');
  loadBoundaries();
}

function exitAllModes(){
  if(_mode==='draw'){clearDrawVertices();_mode=null;}
  if(_mode==='edit'){clearEditSelection();_mode=null;}
  if(_mode==='replace'){clearReplaceSelection();_mode=null;}
  resetToolbar();
  _confirmCallback=null;
}

async function loadBoundaries(){
  if(_geoLayer){map.removeLayer(_geoLayer);_geoLayer=null}
  $('sidebarList').innerHTML='<div style="color:#555;padding:20px;text-align:center">加载中...</div>';
  try{
    var url='/api/geo/boundaries?type='+currentLevel;
    if(currentLevel==='cities'&&_provinceSelect&&_provinceSelect.value){
      url+='&province='+encodeURIComponent(_provinceSelect.value);
    }
    var r=await fetch(url);
    _geoData=await r.json();
    renderMap();
    renderList();
  }catch(e){
    $('sidebarList').innerHTML='<div style="color:#e74c3c;padding:20px;text-align:center">加载失败: '+esc(e.message)+'</div>';
  }
}

function renderMap(){
  if(!_geoData||!_geoData.features)return;
  if(_geoLayer)map.removeLayer(_geoLayer);
  var features=_geoData.features;
  _geoLayer=L.geoJSON(_geoData,{
    style:function(feature){
      var idx=features.indexOf(feature);
      return {color:colors[idx%colors.length],weight:currentLevel==='countries'?1:1.5,fillColor:colors[idx%colors.length],fillOpacity:0.12,opacity:0.7};
    },
    onEachFeature:function(feature,layer){
      var name=feature.properties.name;
      layer.bindTooltip(name,{direction:'center',permanent:false,opacity:0.9});
      layer.on('mouseover',function(e){
        if(_mode)return;
        layer.setStyle({weight:3,fillOpacity:0.3,opacity:1});layer.bringToFront();
        $('infoPanel').innerHTML='<b>'+esc(name)+'</b>';
        if(feature.properties.code)$('infoPanel').innerHTML+='<br>代码: '+feature.properties.code;
        $('infoPanel').classList.add('show');highlightListItem(name);
      });
      layer.on('mouseout',function(){
        if(_mode)return;
        var idx=features.indexOf(feature);
        layer.setStyle({color:colors[idx%colors.length],weight:currentLevel==='countries'?1:1.5,fillOpacity:0.12,opacity:0.7});
        $('infoPanel').classList.remove('show');
      });
      layer.on('click',function(e){
        if(_mode==='draw'){addDrawVertex(e.latlng.lat,e.latlng.lng);return;}
        if(_mode==='edit'){selectEditTarget(feature);return;}
        if(_mode==='replace'){startReplacing(feature);return;}
        if(currentLevel==='provinces'){_provinceSelect={value:name};switchLevel('cities');}
        else if(currentLevel==='cities'){map.fitBounds(layer.getBounds().pad(0.1));}
      });
    }
  }).addTo(map);
  if(features.length>0){var bounds=_geoLayer.getBounds();if(bounds.isValid())map.fitBounds(bounds.pad(0.05));}
  $('sidebarFoot').innerHTML='共 <b>'+features.length+'</b> 个'+(currentLevel==='countries'?'国家':currentLevel==='provinces'?'省份':'城市');
}

function highlightListItem(name){
  document.querySelectorAll('.item').forEach(function(el){el.classList.remove('act')});
  document.querySelectorAll('.item').forEach(function(el){if(el.dataset.name===name)el.classList.add('act')});
}

function renderList(){
  if(!_geoData||!_geoData.features)return;
  var features=_geoData.features;
  var q=($('searchInput').value||'').toLowerCase();
  var filtered=features.filter(function(f){return !q||(f.properties.name||'').toLowerCase().indexOf(q)>=0});
  var html='';
  if(currentLevel==='cities'&&_provinceSelect){
    html+='<div style="padding:4px 10px;font-size:10px;color:#888;margin-bottom:4px"><span onclick="switchLevel(\'provinces\')" style="cursor:pointer;color:#00cec9">← 返回省份</span> | '+esc(_provinceSelect.value)+'</div>';
  }
  if(!filtered.length){html+='<div style="color:#555;padding:20px;text-align:center">暂无匹配</div>'}
  filtered.forEach(function(f,i){
    var idx=features.indexOf(f),color=colors[idx%colors.length],code=f.properties.code||'';
    html+='<div class="item" data-name="'+esc(f.properties.name)+'" onclick="focusFeature(\''+escJs(f.properties.name)+'\')">'+
      '<span class="i-dot" style="background:'+color+'"></span><span class="i-info"><span class="i-name">'+esc(f.properties.name)+'</span>'+
      (code?'<span class="i-code">'+esc(code)+'</span>':'')+'</span>'+
      (currentLevel==='provinces'?'<span class="i-count">→</span>':'')+
      '<span class="i-btns"><button onclick="event.stopPropagation();openEditModal(\''+escJs(f.properties.name)+'\',\''+escJs(code)+'\','+f.id+')" title="属性">✎</button>'+
      '<button class="del" onclick="event.stopPropagation();confirmDelete('+f.id+',\''+escJs(f.properties.name)+'\')" title="删除">✕</button></span></div>';
  });
  $('sidebarList').innerHTML=html;
}

function focusFeature(name){
  if(!_geoLayer)return;
  _geoLayer.eachLayer(function(layer){
    if(layer.feature&&layer.feature.properties.name===name){
      if(currentLevel==='provinces'){_provinceSelect={value:name};switchLevel('cities');}
      else{map.fitBounds(layer.getBounds().pad(0.1));highlightListItem(name);}
    }
  });
}

// ============================================================
//  ✏️ 新建模式
// ============================================================
function startDraw(){
  if(_mode==='draw'){exitAllModes();return;}
  exitAllModes();
  _mode='draw';_drawVertices=[];_drawMarkers=[];_drawPolyline=null;
  $('btnDraw').textContent='⏹ 取消';$('btnDraw').className='danger';
  $('btnEdit').style.display='none';$('btnReplace').style.display='none';$('btnUpload').style.display='none';
  $('drawHint').textContent='🖱️ 点击地图添加顶点 · 双击完成多边形 · ESC 取消';
  $('drawHint').classList.add('show');
  map.getContainer().style.cursor='crosshair';
}

function addDrawVertex(lat,lng){
  _drawVertices.push({lat:lat,lng:lng});
  _drawMarkers.push(L.circleMarker([lat,lng],{radius:5,color:'#f39c12',fillColor:'#f39c12',fillOpacity:0.8,weight:2}).addTo(map));
  if(_drawVertices.length>=2){
    if(_drawPolyline)map.removeLayer(_drawPolyline);
    _drawPolyline=L.polygon(_drawVertices.map(function(v){return[v.lat,v.lng]}),{color:'#f39c12',fillColor:'#f39c12',fillOpacity:0.15,weight:2,dashArray:'6 4'}).addTo(map);
  }
}

function clearDrawVertices(){
  _drawMarkers.forEach(function(m){map.removeLayer(m)});_drawMarkers=[];
  if(_drawPolyline){map.removeLayer(_drawPolyline);_drawPolyline=null}
  _drawVertices=[];
}

map.on('dblclick',function(e){
  if(_mode==='draw'){L.DomEvent.stop(e);if(_drawVertices.length>=3)finishDraw();else showToast('至少需要 3 个顶点');}
  else if(_mode==='replace'&&_replaceTarget){L.DomEvent.stop(e);if(_drawVertices.length>=3)finishReplace();else showToast('至少需要 3 个顶点');}
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(_mode==='draw'){if(_drawVertices.length>0){clearDrawVertices();showToast('顶点已清除，再按 ESC 取消');}else exitAllModes();}
    else if(_mode==='edit')exitAllModes();
    else if(_mode==='replace'){if(_drawVertices.length>0){clearDrawVertices();showToast('顶点已清除');}else exitAllModes();}
  }
});

function finishDraw(){
  var coords=_drawVertices.map(function(v){return[v.lng,v.lat]});coords.push(coords[0]);
  openNewRegionModal({type:'Polygon',coordinates:[coords]});
}

// ============================================================
//  🖊️ 编辑模式（增加/减少顶点）
// ============================================================
function startEdit(){
  if(_mode==='edit'){exitAllModes();return;}
  exitAllModes();
  _mode='edit';
  $('btnEdit').textContent='⏹ 退出编辑';$('btnEdit').className='danger';
  $('btnDraw').style.display='none';$('btnReplace').style.display='none';$('btnUpload').style.display='none';
  map.getContainer().style.cursor='pointer';
  showToast('点击区域进入编辑 · 拖拽顶点调整 · 右键顶点删除 · 点击边上+号增加');
}

function selectEditTarget(feature){
  clearEditSelection();
  var geom=feature.geometry,coords=[];
  if(geom.type==='MultiPolygon')coords=geom.coordinates[0][0].slice();
  else if(geom.type==='Polygon')coords=geom.coordinates[0].slice();
  else{showToast('不支持此几何类型');return;}
  // 去掉闭合点
  if(coords.length>1&&Math.abs(coords[0][0]-coords[coords.length-1][0])<1e-8&&Math.abs(coords[0][1]-coords[coords.length-1][1])<1e-8)coords.pop();

  _editTarget={feature:feature,coords:coords,markers:[],layer:null,origCoords:coords.map(function(c){return[c[0],c[1]]})};
  buildEditMarkers();
  updateEditPreview();
  // 添加边中点+号
  addEdgePlusMarkers();
  showConfirmBar('编辑边界：拖拽顶点 · 右键删点 · 点击+增点 · ');
}

function buildEditMarkers(){
  if(!_editTarget)return;
  _editTarget.markers.forEach(function(m){map.removeLayer(m)});
  _editTarget.markers=[];
  _editTarget.coords.forEach(function(c,i){
    var marker=L.circleMarker([c[1],c[0]],{radius:7,color:'#f39c12',fillColor:'#fff',fillOpacity:1,weight:3,draggable:true});
    marker._vi=i;
    marker.on('drag',function(e){_editTarget.coords[i]=[e.latlng.lng,e.latlng.lat];updateEditPreview();clearEdgePlus();});
    marker.on('dragend',function(){addEdgePlusMarkers()});
    marker.on('contextmenu',function(ev){L.DomEvent.stop(ev);removeVertex(i)});
    marker.addTo(map);
    _editTarget.markers.push(marker);
  });
}

function addEdgePlusMarkers(){
  if(!_editTarget)return;
  clearEdgePlus();
  var n=_editTarget.coords.length;
  _editTarget._edgePlus=[];
  for(var i=0;i<n;i++){
    var j=(i+1)%n;
    var mid=[(_editTarget.coords[i][0]+_editTarget.coords[j][0])/2,(_editTarget.coords[i][1]+_editTarget.coords[j][1])/2];
    var plus=L.circleMarker([mid[1],mid[0]],{radius:10,color:'#2ecc71',fillColor:'#2ecc71',fillOpacity:0.6,weight:2,opacity:0.7});
    plus._insertAfter=i;
    plus.on('click',function(ev){L.DomEvent.stop(ev);insertVertex(this._insertAfter)});
    plus.bindTooltip('+',{direction:'center',permanent:true,className:'vertex-plus',offset:[0,0]});
    plus.addTo(map);
    _editTarget._edgePlus.push(plus);
  }
}

function clearEdgePlus(){
  if(_editTarget&&_editTarget._edgePlus){_editTarget._edgePlus.forEach(function(p){map.removeLayer(p)});_editTarget._edgePlus=[]}
}

function insertVertex(afterIdx){
  if(!_editTarget)return;
  var i=afterIdx,j=(afterIdx+1)%_editTarget.coords.length;
  var mid=[(_editTarget.coords[i][0]+_editTarget.coords[j][0])/2,(_editTarget.coords[i][1]+_editTarget.coords[j][1])/2];
  _editTarget.coords.splice(i+1,0,mid);
  buildEditMarkers();updateEditPreview();addEdgePlusMarkers();
}

function removeVertex(idx){
  if(!_editTarget)return;
  if(_editTarget.coords.length<=3){showToast('多边形至少需要 3 个顶点');return;}
  _editTarget.coords.splice(idx,1);
  buildEditMarkers();updateEditPreview();addEdgePlusMarkers();
}

function updateEditPreview(){
  if(!_editTarget)return;
  if(_editTarget.layer)map.removeLayer(_editTarget.layer);
  var closed=_editTarget.coords.concat([_editTarget.coords[0]]);
  _editTarget.layer=L.polygon(closed.map(function(c){return[c[1],c[0]]}),{color:'#f39c12',fillColor:'#f39c12',fillOpacity:0.2,weight:2,dashArray:'6 4'}).addTo(map);
}

function clearEditSelection(){
  if(_editTarget){
    _editTarget.markers.forEach(function(m){map.removeLayer(m)});
    if(_editTarget.layer)map.removeLayer(_editTarget.layer);
    clearEdgePlus();
  }
  _editTarget=null;
}

function showConfirmBar(msg){
  $('confirmInfo').textContent=msg;
  $('confirmBar').classList.add('show');
}

function confirmAction(){
  if(_mode==='edit'&&_editTarget)saveEdit();
  else if(_mode==='draw')finishDraw();
  else if(_mode==='replace'&&_replaceTarget)finishReplace();
  else showToast('无待确认的操作');
}

function cancelAction(){
  if(_mode==='edit'&&_editTarget){
    // 恢复原始坐标
    _editTarget.coords=_editTarget.origCoords.map(function(c){return[c[0],c[1]]});
    buildEditMarkers();updateEditPreview();addEdgePlusMarkers();
    showToast('已恢复原始边界');
  }
  exitAllModes();loadBoundaries();
}

async function saveEdit(){
  if(!_editTarget)return;
  var coords=_editTarget.coords.map(function(c){return[c[0],c[1]]});coords.push(coords[0]);
  try{
    var r=await fetch('/api/geo/boundaries/'+_editTarget.feature.id+'?type='+currentLevel,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:currentLevel,geometry:{type:'Polygon',coordinates:[coords]}})
    });
    var data=await r.json();
    if(data.ok){showToast('✅ 边界已更新');exitAllModes();loadBoundaries();}
    else showToast('❌ '+data.error);
  }catch(e){showToast('❌ '+e.message);}
}

// ============================================================
//  🔄 替换模式
// ============================================================
function startReplace(){
  if(_mode==='replace'){exitAllModes();return;}
  exitAllModes();
  _mode='replace';
  $('btnReplace').textContent='⏹ 取消';$('btnReplace').className='danger';
  $('btnDraw').style.display='none';$('btnEdit').style.display='none';$('btnUpload').style.display='none';
  map.getContainer().style.cursor='pointer';
  showToast('点击要替换边界的区域');
}

function startReplacing(feature){
  _replaceTarget={feature:feature};
  _drawVertices=[];_drawMarkers=[];_drawPolyline=null;
  $('drawHint').text='🔄 重新绘制「'+feature.properties.name+'」的边界 · 双击完成 · ESC 取消';
  $('drawHint').classList.add('show');
  map.getContainer().style.cursor='crosshair';
  showConfirmBar('替换「'+feature.properties.name+'」的边界');
  // 高亮原区域
  _geoLayer.eachLayer(function(l){
    if(l.feature&&l.feature.id===feature.id)l.setStyle({color:'#e74c3c',weight:3,fillColor:'#e74c3c',fillOpacity:0.2,opacity:1,dashArray:'4 2'});
  });
}

function clearReplaceSelection(){
  _replaceTarget=null;
}

function finishReplace(){
  var coords=_drawVertices.map(function(v){return[v.lng,v.lat]});coords.push(coords[0]);
  var name=_replaceTarget.feature.properties.name;
  $('modalContent').innerHTML=
    '<h3>确认替换</h3>'+
    '<p style="color:#f39c12;font-size:11px;margin-bottom:14px">将 <b>'+esc(name)+'</b> 的边界替换为新绘制的多边形（'+_drawVertices.length+' 个顶点）？旧边界将被覆盖。</p>'+
    '<div class="btns"><button onclick="closeModal();clearDrawVertices()">取消</button>'+
    '<button class="primary" onclick="submitReplace()">确认替换</button></div>';
  $('modalOverlay').classList.add('show');
}

async function submitReplace(){
  var coords=_drawVertices.map(function(v){return[v.lng,v.lat]});coords.push(coords[0]);
  try{
    var r=await fetch('/api/geo/boundaries/'+_replaceTarget.feature.id+'?type='+currentLevel,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:currentLevel,geometry:{type:'Polygon',coordinates:[coords]}})
    });
    var data=await r.json();
    if(data.ok){showToast('✅ 边界已替换');closeModal();clearDrawVertices();exitAllModes();loadBoundaries();}
    else showToast('❌ '+data.error);
  }catch(e){showToast('❌ '+e.message);}
}

// ============================================================
//  📤 上传模式
// ============================================================
function openUploadModal(){
  var levelLabel=currentLevel==='countries'?'国家':currentLevel==='provinces'?'省份':'城市';
  $('modalContent').innerHTML=
    '<h3>📤 上传 GeoJSON 导入'+levelLabel+'</h3>'+
    '<p style="font-size:10px;color:#888;margin-bottom:10px">支持 .geojson / .json 文件。每个 Feature 需要有 <code>name</code> 属性，可选 <code>code</code>。</p>'+
    '<div class="upload-zone" id="uploadZone" onclick="$(\'fileInput\').click()">'+
      '<div style="font-size:24px;margin-bottom:6px">📁</div>'+
      '<div>点击选择文件 或拖拽到此处</div>'+
      '<div style="font-size:9px;color:#555;margin-top:4px">.geojson · .json</div>'+
      '<input type="file" id="fileInput" accept=".geojson,.json" onchange="handleUploadFile(event)" />'+
    '</div>'+
    '<div id="uploadResult" style="font-size:10px;margin-top:8px;display:none"></div>'+
    '<div class="btns"><button onclick="closeModal()">关闭</button></div>';
  $('modalOverlay').classList.add('show');

  var zone=$('uploadZone');
  zone.ondragover=function(e){e.preventDefault();zone.classList.add('drag')};
  zone.ondragleave=function(){zone.classList.remove('drag')};
  zone.ondrop=function(e){e.preventDefault();zone.classList.remove('drag');
    if(e.dataTransfer.files.length){uploadGeoJSON(e.dataTransfer.files[0])}
  };
}

async function handleUploadFile(e){
  if(e.target.files.length)await uploadGeoJSON(e.target.files[0]);
}

async function uploadGeoJSON(file){
  var result=$('uploadResult');
  result.style.display='block';result.style.color='#f39c12';result.textContent='上传中...';
  try{
    var text=await file.text();
    var geojson=JSON.parse(text);
    var featureCount=(geojson.features||[]).length||(geojson.type==='Feature'?1:0);
    if(!featureCount){result.style.color='#e74c3c';result.textContent='❌ 无效的 GeoJSON 文件';return;}

    var r=await fetch('/api/geo/boundaries/upload?type='+currentLevel,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(geojson)
    });
    var data=await r.json();
    if(data.ok){
      result.style.color='#2ecc71';
      result.textContent='✅ 成功导入 '+data.inserted+' 条记录'+(data.skipped?'，跳过 '+data.skipped:'');
      showToast('导入完成: '+data.inserted+' 条');
      setTimeout(function(){closeModal();loadBoundaries()},1500);
    }else{
      result.style.color='#e74c3c';result.textContent='❌ '+data.error;
    }
  }catch(e){result.style.color='#e74c3c';result.textContent='❌ 解析失败: '+e.message;}
}

// ============================================================
//  属性编辑 / 新建 / 删除弹窗
// ============================================================
var _pendingGeometry=null;
function openNewRegionModal(geometry){
  _pendingGeometry=geometry;
  var codeField=currentLevel==='countries'?'':'<div class="field"><label>代码</label><input id="fldCode" placeholder="如 110000（省级）/ 110100（市级）" /></div>';
  $('modalContent').innerHTML=
    '<h3>新建'+(currentLevel==='countries'?'国家':currentLevel==='provinces'?'省份':'城市')+'</h3>'+
    '<div class="field"><label>名称</label><input id="fldName" placeholder="区域名称" autofocus /></div>'+codeField+
    '<div class="btns"><button onclick="closeModal();clearDrawVertices();exitAllModes();loadBoundaries()">取消</button>'+
    '<button class="primary" onclick="submitNewRegion()">✅ 确认创建</button></div>';
  $('modalOverlay').classList.add('show');
  setTimeout(function(){$('fldName').focus()},100);
}

function closeModal(){$('modalOverlay').classList.remove('show');_pendingGeometry=null;}

async function submitNewRegion(){
  var name=($('fldName').value||'').trim();
  if(!name){showToast('请输入名称');return;}
  var code='';
  if(currentLevel!=='countries')code=($('fldCode')?$('fldCode').value:'').trim();
  try{
    var r=await fetch('/api/geo/boundaries',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:currentLevel,name:name,code:code,geometry:_pendingGeometry})});
    var data=await r.json();
    if(data.ok){showToast('✅ 已创建');closeModal();clearDrawVertices();exitAllModes();loadBoundaries();}
    else showToast('❌ '+data.error);
  }catch(e){showToast('❌ '+e.message);}
}

function openEditModal(name,code,id){
  var codeField=currentLevel==='countries'?'':'<div class="field"><label>代码</label><input id="fldCode" value="'+esc(code)+'" /></div>';
  $('modalContent').innerHTML=
    '<h3>编辑属性</h3><div class="field"><label>名称</label><input id="fldName" value="'+esc(name)+'" /></div>'+codeField+
    '<div class="btns"><button onclick="closeModal()">取消</button><button class="primary" onclick="submitEditProps('+id+')">💾 确认保存</button></div>';
  $('modalOverlay').classList.add('show');
}

async function submitEditProps(id){
  var name=($('fldName').value||'').trim();
  if(!name){showToast('请输入名称');return;}
  var body={type:currentLevel,name:name};
  if(currentLevel!=='countries')body.code=($('fldCode')?$('fldCode').value:'').trim();
  try{
    var r=await fetch('/api/geo/boundaries/'+id+'?type='+currentLevel,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var data=await r.json();
    if(data.ok){showToast('✅ 已更新');closeModal();loadBoundaries();}
    else showToast('❌ '+data.error);
  }catch(e){showToast('❌ '+e.message);}
}

function confirmDelete(id,name){
  $('modalContent').innerHTML=
    '<h3>⚠️ 确认删除</h3><p style="color:#e74c3c;font-size:11px;margin-bottom:14px">确定要删除 <b>'+esc(name)+'</b> 吗？此操作不可撤销。</p>'+
    '<div class="btns"><button onclick="closeModal()">取消</button><button class="danger" onclick="submitDelete('+id+')">确认删除</button></div>';
  $('modalOverlay').classList.add('show');
}

async function submitDelete(id){
  try{
    var r=await fetch('/api/geo/boundaries/'+id+'?type='+currentLevel,{method:'DELETE'});
    var data=await r.json();
    if(data.ok){showToast('✅ 已删除');closeModal();loadBoundaries();}
    else showToast('❌ '+data.error);
  }catch(e){showToast('❌ '+e.message);}
}

$('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')}

loadBoundaries();
</script>
